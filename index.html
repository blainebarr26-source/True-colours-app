<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>True Colours Creator Hub</title>
<style>
:root{--bg:#08070c;--card:#131019;--card2:#19141f;--line:#2a2432;--white:#fff;--muted:#9e98a8;--purple:#8b5cf6;--pink:#ec4899;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#08070c,#120b18);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:24px 18px 10px}.brand{font-size:12px;letter-spacing:3px;font-weight:900;color:var(--purple)}h1{font-size:30px;margin:5px 0}.muted{color:var(--muted)}.card{background:rgba(19,16,25,.95);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 16px}.hero{background:linear-gradient(135deg,#211532,#15101b)}.eyebrow{font-size:11px;color:var(--muted);font-weight:800}.big{font-size:48px;font-weight:900;margin:4px 0}.track{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:14px}.fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.value{font-size:23px;font-weight:900}.label{font-size:12px;color:var(--muted);margin-top:5px}.section{font-size:17px;font-weight:900;margin-bottom:12px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tool{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:15px;color:#fff;cursor:pointer}.row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#0d0b12;border-top:1px solid var(--line);display:flex;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;background:none;border:0;color:var(--muted);font-size:10px;font-weight:800}.nav button.active{color:var(--purple)}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.loginbox{width:100%;max-width:440px}.logo{font-size:48px;font-weight:950;line-height:.9;letter-spacing:2px}.roles{display:flex;gap:8px;margin:24px 0 10px}.role{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:800}.role.active{background:var(--purple);border-color:var(--purple)}input{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;margin-top:9px;outline:none}.primary{width:100%;padding:16px;margin-top:12px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-weight:900}.small{font-size:12px;text-align:center;margin-top:12px;color:var(--muted)}.hidden{display:none}.back{background:none;border:0;color:var(--purple);font-weight:800;padding:0;margin-bottom:8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const creators=[
{name:"Blaine",user:"@blaine",city:"Nottinghamshire",diamonds:3284,target:5000,days:2,hours:7.7,status:"Active"},
{name:"Mia",user:"@mia_live",city:"Manchester",diamonds:12480,target:15000,days:8,hours:31.5,status:"Active"},
{name:"Jordan",user:"@jordanlive",city:"Birmingham",diamonds:10920,target:12000,days:7,hours:28.1,status:"Active"},
{name:"Kieran",user:"@kieran_streams",city:"Leeds",diamonds:8430,target:10000,days:6,hours:22.4,status:"Active"},
{name:"Sophie",user:"@sophiecreates",city:"London",diamonds:7620,target:10000,days:5,hours:19.8,status:"Away"},
{name:"Ellie",user:"@ellie_live",city:"Nottingham",diamonds:6110,target:8000,days:4,hours:15.2,status:"Active"}];
let role="creator",page="home",logged=false;
const root=document.getElementById("root");
function card(x){return `<div class="card">${x}</div>`}
function stats(c){return `<div class="grid"><div class="stat"><div class="value">${c.days}</div><div class="label">Valid days</div></div><div class="stat"><div class="value">${c.hours}h</div><div class="label">Live hours</div></div><div class="stat"><div class="value">0</div><div class="label">Battles</div></div><div class="stat"><div class="value">92%</div><div class="label">Fan club</div></div></div>`}
function nav(items){return `<div class="nav">${items.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join("")}<button onclick="logout()">Log out</button></div>`}
function login(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="brand">TRUE COLOURS</div><div class="logo">CREATOR<br>HUB</div><p class="muted">Creator & Management Platform</p><div class="roles"><button class="role ${role==='creator'?'active':''}" onclick="role='creator';login()">Creator</button><button class="role ${role==='manager'?'active':''}" onclick="role='manager';login()">Management</button></div><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="signin()">Sign in</button><div class="small">${role==='manager'?'Demo: manager@truecolours.app / demo':'Demo: any email and password'}</div></div></div>`}
function signin(){let e=document.getElementById("email").value,p=document.getElementById("pass").value;if(role==='manager'&&(e.toLowerCase()!=='manager@truecolours.app'||p!=='demo'))return alert("Use manager@truecolours.app / demo for management demo.");if(role==='creator'&&(!e||!p))return alert("Enter an email and password.");logged=true;page='home';render()}
function logout(){logged=false;login()}
function go(p){page=p;render()}
function header(title,sub=""){return `<div class="top"><div class="brand">TRUE COLOURS</div><h1>${title}</h1><div class="muted">${sub}</div></div>`}
function creatorView(){
let c=creators[0],pct=Math.round(c.diamonds/c.target*100);
if(page==='home')return header("Creator Dashboard","September 2026")+card(`<div class="eyebrow">MONTHLY DIAMONDS</div><div class="big">${c.diamonds.toLocaleString()}</div><div class="muted">of ${c.target.toLocaleString()} target</div><div class="track"><div class="fill" style="width:${pct}%"></div></div><p class="muted">${pct}% complete</p>`)+stats(c)+card(`<div class="section">Creator tools</div><div class="tools">${["performance","streams","leaderboard","rewards","campaigns","support"].map(x=>`<button class="tool" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>`)+card(`<div class="section">Announcement</div><b>September targets are live</b><p class="muted">Check your dashboard for your monthly target and progress.</p>`)+nav([["home","Home"],["performance","Performance"],["streams","Streams"],["leaderboard","Leaderboard"]]);
if(page==='performance')return header("Performance")+card(`<div class="section">Monthly target</div><div class="big">${c.diamonds.toLocaleString()}</div><div class="track"><div class="fill" style="width:${pct}%"></div></div>`)+stats(c)+nav([["home","Home"],["performance","Performance"],["streams","Streams"],["leaderboard","Leaderboard"]]);
if(page==='streams')return header("Stream History")+["Today • 3h 12m • 1,240 diamonds","22 Sep • 2h 04m • 980 diamonds","20 Sep • 2h 27m • 1,064 diamonds"].map(x=>card(`<b>${x}</b>`)).join("")+nav([["home","Home"],["performance","Performance"],["streams","Streams"],["leaderboard","Leaderboard"]]);
if(page==='leaderboard')return header("Leaderboard")+creators.map((x,i)=>card(`<div class="row"><b>#${i+1} ${x.name}</b><b>${x.diamonds.toLocaleString()}</b></div>`)).join("")+nav([["home","Home"],["performance","Performance"],["streams","Streams"],["leaderboard","Leaderboard"]]);
return header(page[0].toUpperCase()+page.slice(1))+card(`<div class="section">True Colours</div><p class="muted">This section is ready for the full creator workflow.</p>`)+nav([["home","Home"],["performance","Performance"],["streams","Streams"],["leaderboard","Leaderboard"]])
}
function managerView(){
if(page==='home'){let total=creators.reduce((a,c)=>a+c.diamonds,0);return header("Management","Agency overview")+`<div class="grid"><div class="stat"><div class="value">${creators.length}</div><div class="label">Creators</div></div><div class="stat"><div class="value">${creators.filter(c=>c.status==='Active').length}</div><div class="label">Active</div></div><div class="stat"><div class="value">${total.toLocaleString()}</div><div class="label">Diamonds</div></div><div class="stat"><div class="value">3</div><div class="label">Campaigns</div></div></div>`+card(`<div class="section">Creators</div>`+creators.map((c,i)=>`<div class="row" onclick="go('creator${i}')"><span><b>${c.name}</b><br><span class="muted">${c.user} • ${c.city}</span></span><b>${c.diamonds.toLocaleString()}</b></div>`).join(""))+card(`<div class="section">Management</div><div class="tools">${["campaigns","announcements","reports","permissions"].map(x=>`<button class="tool" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>`)+nav([["home","Overview"],["campaigns","Campaigns"],["reports","Reports"]])}
if(page.startsWith("creator")){let c=creators[+page.replace("creator","")];let pct=Math.round(c.diamonds/c.target*100);return header(c.name,c.user)+card(`<div class="grid"><div class="stat"><div class="value">${c.diamonds.toLocaleString()}</div><div class="label">Diamonds</div></div><div class="stat"><div class="value">${c.target.toLocaleString()}</div><div class="label">Target</div></div><div class="stat"><div class="value">${c.days}</div><div class="label">Valid days</div></div><div class="stat"><div class="value">${c.hours}h</div><div class="label">Live hours</div></div></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><p class="muted">${pct}% of target • ${c.status}</p>`)+card(`<div class="section">Account</div><p>${c.city}</p><p class="muted">Creator profile and management actions will connect to the real database here.</p>`)+card(`<button class="back" onclick="go('home')">← Back to creators</button>`)+nav([["home","Overview"],["campaigns","Campaigns"],["reports","Reports"]])}
return header(page[0].toUpperCase()+page.slice(1))+card(`<div class="section">${page[0].toUpperCase()+page.slice(1)}</div><p class="muted">This management area is ready for database-backed functionality.</p>`)+nav([["home","Overview"],["campaigns","Campaigns"],["reports","Reports"]])
}
function render(){root.innerHTML=role==='creator'?creatorView():managerView()}
login();
</script>
</body></html>
