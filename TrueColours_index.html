<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>True Colours Creator Hub</title>
<style>
:root{--bg:#08070c;--card:#131019;--card2:#18131f;--line:#2a2432;--text:#fff;--muted:#a6a0ae;--purple:#8b5cf6;--pink:#ec4899;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#08070c,#100915);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:24px 18px 110px}.brand{letter-spacing:4px;color:#a875ff;font-size:12px;font-weight:800}.title{font-size:34px;font-weight:850;margin:7px 0}.sub{color:var(--muted);margin-bottom:22px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(520px,100%)}.login h1{font-size:50px;line-height:.95;margin:8px 0 12px}.tabs{display:flex;gap:8px;margin:24px 0 16px}.tabs button,.nav button,.tool,.action{background:var(--card);border:1px solid var(--line);color:white;border-radius:14px;padding:14px;font-weight:750}.tabs button{flex:1}.tabs .active,.primary{background:linear-gradient(90deg,var(--purple),var(--pink));border:0}.input{width:100%;padding:16px;margin:6px 0;background:#111017;border:1px solid var(--line);border-radius:13px;color:white}.primary{width:100%;padding:16px;border-radius:13px;color:white;font-weight:800;margin-top:8px}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.card{background:rgba(19,16,25,.92);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 10px 35px #0003}.hero .label,.label{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.5px}.big{font-size:48px;font-weight:900;margin:4px 0}.progress{height:9px;background:#2b2533;border-radius:99px;overflow:hidden;margin:16px 0 8px}.bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:99px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:18px}.stat b{font-size:25px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:5px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sectiontitle{font-size:19px;font-weight:850;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted)}.green{color:var(--green)}.list{display:grid;gap:10px}.listitem{padding:15px;background:#15121b;border:1px solid var(--line);border-radius:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0910ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;padding:10px 12px;color:#aaa}.nav .on{color:#b477ff}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logout{background:none;border:1px solid var(--line);color:#aaa;border-radius:10px;padding:9px 12px}.managerGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.search{width:100%;padding:14px;background:#111017;border:1px solid var(--line);border-radius:12px;color:#fff;margin:8px 0 14px}@media(max-width:700px){.wrap{padding-top:20px}.managerGrid{grid-template-columns:repeat(2,1fr)}.login h1{font-size:42px}.big{font-size:42px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const creators=[
{name:"Blaine",city:"Nottinghamshire",diamonds:3284,hours:"7h 43m",days:2,status:"Active"},
{name:"Amelia",city:"Manchester",diamonds:5210,hours:"11h 20m",days:6,status:"Active"},
{name:"Jay",city:"Birmingham",diamonds:4475,hours:"9h 05m",days:5,status:"Active"},
{name:"Luca",city:"London",diamonds:2890,hours:"6h 40m",days:3,status:"Active"},
{name:"Chloe",city:"Nottingham",diamonds:1980,hours:"4h 15m",days:2,status:"At risk"}
];
let role="creator",logged=false,page="home";
const app=document.getElementById("app");
function login(){
app.innerHTML=`<main class="login"><div class="loginbox">
<div class="brand">TRUE COLOURS</div><h1>CREATOR<br>HUB</h1><div class="sub">Creator & Management Platform</div>
<div class="tabs"><button class="${role==='creator'?'active':''}" onclick="role='creator';login()">Creator</button><button class="${role==='manager'?'active':''}" onclick="role='manager';login()">Management</button></div>
<input class="input" id="email" placeholder="Email" type="email"><input class="input" id="pass" placeholder="Password" type="password">
<button class="primary" onclick="logged=true;page='home';render()">Sign in</button><div class="hint">Demo mode — any email and password</div></div></main>`;
}
function nav(){
return `<nav class="nav">${(role==='creator'?['home','performance','streams','leaderboard','rewards']:['home','creators','campaigns','announcements']).map(x=>`<button class="${page===x?'on':''}" onclick="page='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}<button onclick="logged=false;login()">Log out</button></nav>`;
}
function creatorHome(){
return `<div class="wrap"><div class="top"><div><div class="brand">TRUE COLOURS</div><div class="title">Creator Dashboard</div><div class="sub">September 2026</div></div><button class="logout" onclick="logged=false;login()">Log out</button></div>
<div class="card hero"><div class="label">MONTHLY DIAMONDS</div><div class="big">3,284</div><div class="muted">of 5,000 target</div><div class="progress"><div class="bar" style="width:66%"></div></div><b>66% complete</b></div>
<div class="grid"><div class="stat"><b>2</b><span>Valid days</span></div><div class="stat"><b>7.7h</b><span>Live hours</span></div><div class="stat"><b>0</b><span>Battles</span></div><div class="stat"><b>92%</b><span>Fan club</span></div></div>
<div class="card"><div class="sectiontitle">Creator tools</div><div class="tools">${['performance','streams','leaderboard','rewards','campaigns','support'].map(x=>`<button class="tool" onclick="page='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>
<div class="card"><div class="sectiontitle">Announcement</div><b>September targets are live</b><p class="muted">Check your dashboard for your monthly target and progress.</p></div></div>${nav()}`;
}
function performance(){return `<div class="wrap"><div class="brand">TRUE COLOURS</div><div class="title">Performance</div><div class="sub">Your September progress</div><div class="grid"><div class="stat"><b>3,284</b><span>Diamonds</span></div><div class="stat"><b>66%</b><span>Target progress</span></div><div class="stat"><b>7h 43m</b><span>Live hours</span></div><div class="stat"><b>2</b><span>Valid days</span></div></div><div class="card"><div class="sectiontitle">Monthly target</div><div class="progress"><div class="bar" style="width:66%"></div></div><div class="row"><span class="muted">3,284 diamonds</span><b>5,000 target</b></div></div>${nav()}</div>`}
function streams(){return `<div class="wrap"><div class="brand">TRUE COLOURS</div><div class="title">Stream History</div><div class="sub">Recent live sessions</div><div class="list">${[['24 Sep','2h 14m','1,240'],['22 Sep','1h 52m','980'],['20 Sep','1h 41m','640'],['18 Sep','1h 56m','424']].map(x=>`<div class="listitem"><div class="row"><b>${x[0]}</b><span class="green">+${x[2]} 💎</span></div><div class="muted">${x[1]} live</div></div>`).join('')}</div>${nav()}</div>`}
function leaderboard(){let sorted=[...creators].sort((a,b)=>b.diamonds-a.diamonds);return `<div class="wrap"><div class="brand">TRUE COLOURS</div><div class="title">Leaderboard</div><div class="sub">September diamonds</div><div class="list">${sorted.map((c,i)=>`<div class="listitem"><div class="row"><b>#${i+1} ${c.name}</b><b>${c.diamonds.toLocaleString()} 💎</b></div><div class="muted">${c.city}</div></div>`).join('')}</div>${nav()}</div>`}
function rewards(){return `<div class="wrap"><div class="brand">TRUE COLOURS</div><div class="title">Rewards</div><div class="sub">Your creator rewards</div>${[['Tier 1','£5.54','Unlocked'],['Creator Spotlight','Featured profile','Unlocked'],['Tier 2','£15.00','Locked'],['Elite Reward','£50.00','Locked']].map(x=>`<div class="card"><div class="row"><div><b>${x[0]}</b><div class="muted">${x[1]}</div></div><span class="${x[2]==='Unlocked'?'green':'muted'}">${x[2]}</span></div></div>`).join('')}${nav()}</div>`}
function campaigns(){return `<div class="wrap"><div class="brand">TRUE COLOURS</div><div class="title">Campaigns</div><div class="sub">Current agency campaigns</div>${[['September Showdown','Live','Monthly diamond challenge'],['Creator Growth Challenge','Live','Build consistent live hours'],['Box Battle Week','Upcoming','Agency battle event'],['Creator Spotlight','Live','Featured creator opportunity']].map(x=>`<div class="card"><div class="row"><b>${x[0]}</b><span class="green">${x[1]}</span></div><p class="muted">${x[2]}</p></div>`).join('')}${nav()}</div>`}
function managerHome(){let total=creators.reduce((s,c)=>s+c.diamonds,0);return `<div class="wrap"><div class="top"><div><div class="brand">TRUE COLOURS</div><div class="title">Management</div><div class="sub">Agency overview • September 2026</div></div><button class="logout" onclick="logged=false;login()">Log out</button></div><div class="managerGrid"><div class="stat"><b>${creators.length}</b><span>Creators</span></div><div class="stat"><b>${total.toLocaleString()}</b><span>Total diamonds</span></div><div class="stat"><b>4</b><span>Active campaigns</span></div><div class="stat"><b>1</b><span>Needs attention</span></div></div><div class="card"><div class="sectiontitle">Agency announcement</div><b>September targets are live</b><p class="muted">Use the management area to monitor creators and campaigns.</p></div><div class="card"><div class="sectiontitle">Creator activity</div>${creators.slice(0,4).map(c=>`<div class="listitem" style="margin:8px 0"><div class="row"><b>${c.name}</b><span>${c.diamonds.toLocaleString()} 💎</span></div><div class="muted">${c.hours} • ${c.days} valid days</div></div>`).join('')}</div>${nav()}</div>`}
function managerCreators(){return `<div class="wrap"><div class="brand">TRUE COLOURS</div><div class="title">Creators</div><div class="sub">Manage creator performance</div><input class="search" placeholder="Search creators..." oninput="filterCreators(this.value)"><div id="creatorList">${creatorList(creators)}</div>${nav()}</div>`}
function creatorList(arr){return `<div class="list">${arr.map(c=>`<div class="listitem"><div class="row"><b>${c.name}</b><b>${c.diamonds.toLocaleString()} 💎</b></div><div class="muted">${c.city} • ${c.hours} • ${c.days} valid days</div><div class="${c.status==='At risk'?'':'green'}" style="margin-top:7px">${c.status}</div></div>`).join('')}</div>`}
function filterCreators(v){document.getElementById('creatorList').innerHTML=creatorList(creators.filter(c=>c.name.toLowerCase().includes(v.toLowerCase())||c.city.toLowerCase().includes(v.toLowerCase())));}
function managerCampaigns(){return campaigns().replace('Campaigns','Campaign Management').replace('Current agency campaigns','Create and monitor agency campaigns')}
function announcements(){return `<div class="wrap"><div class="brand">TRUE COLOURS</div><div class="title">Announcements</div><div class="sub">Management notices</div><div class="card"><b>September targets are live</b><p class="muted">Monthly targets have been published for all active creators.</p></div><div class="card"><b>Upcoming battle week</b><p class="muted">Prepare creators for the next agency battle campaign.</p></div>${nav()}</div>`}
function render(){if(!logged)return login();if(role==='creator'){if(page==='home')app.innerHTML=creatorHome();else if(page==='performance')app.innerHTML=performance();else if(page==='streams')app.innerHTML=streams();else if(page==='leaderboard')app.innerHTML=leaderboard();else if(page==='rewards')app.innerHTML=rewards();else app.innerHTML=campaigns()}else{if(page==='home')app.innerHTML=managerHome();else if(page==='creators')app.innerHTML=managerCreators();else if(page==='campaigns')app.innerHTML=managerCampaigns();else app.innerHTML=announcements()}}
render();
</script>
</body>
</html>
